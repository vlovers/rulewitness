name: Engineering work package
description: One scoped engineering or governance task with ownership and verifiable acceptance criteria
title: "[Engineering] "
body:
  - type: markdown
    attributes:
      value: "Link to the parent issue and reuse existing PRs before creating a new one. Keep project-specific rules in AGENTS.md authoritative."
  - type: input
    id: parent
    attributes:
      label: Parent issue / roadmap
      description: "Parent issue URL; governance parent is #90."
      placeholder: "https://github.com/vlovers/rulewitness/issues/90"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and acceptance criteria
      description: >-
        State the user-visible or governance outcome and independently verifiable criteria.
        For analyzer/API changes, explicitly address published JSON schema v1,
        CLI exit codes 0/1/2/3 (including uncertainty exit 3), complete:false,
        fail-closed handling of unsupported rules and missing Git objects,
        and backward compatibility of public APIs and npm consumers.
        Experimental Codex configured posture is not effective runtime authorization.
        Distinguish implemented, tested, reviewed, merged and published.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and exclusions
      description: >-
        List allowed and forbidden paths, trust boundaries and non-goals.
        Never execute analyzed settings, commands or hooks, fetch untrusted Git
        revisions, mutate Git state during analysis, or expose credentials.
        State read-only fork/consumer security and release safety implications.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Agent ownership and dependencies
      description: "List 2–5 agents only when genuinely parallelizable; one worktree per agent, non-overlapping file ownership, dependency order and integration owner. For serial work, justify one agent."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: >-
        At issue creation list planned commands, independent semantic oracle,
        malformed/untrusted Git and uncertainty regression cases, required CI,
        isolated installed-package consumer checks when relevant, and an
        independent reviewer. At handoff record exact head SHA, actual commands,
        statuses and links; distinguish PASS, FAIL, N/A and NOT RUN.
        Never claim pending CI passed.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Handoff, artifacts and recovery
      description: "Expected artifacts, location/retention, current branch/SHA, resume instructions, rollback and known blockers."
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Delivery safety
      options:
        - label: Existing related Issues and PRs were checked for duplicates.
          required: true
        - label: No autonomous merge, release, deployment, self-approval or branch protection changes.
          required: true
