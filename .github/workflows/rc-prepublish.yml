name: RC registry and package verification
on:
  pull_request:
    paths:
      - .github/workflows/rc-prepublish.yml
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - scripts/verify-rc-registry.mjs
      - scripts/verify-rc-lookup-error.mjs
      - test/rc-lookup-error.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check candidate version, lockfile, changelog and read-only npm registry state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const change = fs.readFileSync("CHANGELOG.md", "utf8");
            if (pkg.name !== "rulewitness" || pkg.version !== "0.4.0-rc.3" ||
              lock.name !== pkg.name || lock.version !== pkg.version ||
              lock.packages?.[""]?.name !== pkg.name || lock.packages?.[""]?.version !== pkg.version ||
              !change.split("\n").some(line => line.startsWith("## " + pkg.version + " "))) {
              throw Error("Candidate metadata is not ready");
            }
          '
          npm view rulewitness versions --json --registry=https://registry.npmjs.org/ --prefer-online --cache="$RUNNER_TEMP/prepublish-cache" > "$RUNNER_TEMP/versions.json"
          npm view rulewitness dist-tags --json --registry=https://registry.npmjs.org/ --prefer-online --cache="$RUNNER_TEMP/prepublish-cache" > "$RUNNER_TEMP/tags.json"
          if npm view rulewitness@0.4.0-rc.3 dist.integrity --json --registry=https://registry.npmjs.org/ --prefer-online --cache="$RUNNER_TEMP/prepublish-cache" > "$RUNNER_TEMP/rc-integrity.json" 2> "$RUNNER_TEMP/rc-lookup-error.txt"; then
            :
          else
            # An absent prerelease is valid before publication, but unexpected
            # registry failures are not. Only a verified 404 may map to null.
            node scripts/verify-rc-lookup-error.mjs "$RUNNER_TEMP/rc-lookup-error.txt" "$RUNNER_TEMP/versions.json"
            printf 'null\n' > "$RUNNER_TEMP/rc-integrity.json"
          fi
          node scripts/verify-rc-registry.mjs "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/tags.json" "$RUNNER_TEMP/rc-integrity.json"
      - name: Check compiled tarball and isolated installed consumer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm run test:package
          node test/release-artifact-integrity.mjs
          npm run format:check
      - name: Record exact verified candidate commit
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            echo "PR candidate head: $HEAD_SHA"
          else
            echo "Candidate commit: $(git rev-parse HEAD)"
          fi
          echo "This workflow NEVER publishes, tags, or executes analyzed policy commands."
