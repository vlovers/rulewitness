name: Temporary release doc formatting diagnosis
on:
  pull_request:
    paths:
      - .github/workflows/temp-doc-format.yml
      - test/release-doc-consistency.test.ts
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx --no-install prettier --write test/release-doc-consistency.test.ts
          git diff -- test/release-doc-consistency.test.ts
