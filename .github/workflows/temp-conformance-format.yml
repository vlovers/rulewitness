name: Temporary conformance formatting diagnosis
on:
  pull_request:
    paths:
      - .github/workflows/temp-conformance-format.yml
      - test/claude-conformance-matrix.test.ts
      - docs/claude-conformance-matrix.md
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit canonical Prettier diff (diagnostic only)
        run: |
          npx --no-install prettier --write test/claude-conformance-matrix.test.ts docs/claude-conformance-matrix.md
          git diff -- test/claude-conformance-matrix.test.ts docs/claude-conformance-matrix.md
